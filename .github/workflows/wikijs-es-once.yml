# One run only: brings the es-ES copies of the pages up to date. Deleted after use.
name: Publish docs to es-ES once

on: workflow_dispatch

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WIKI_URL: https://docs.jjsm.science
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Allow this runner through Cloudflare
        id: cf_allow
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID || vars.CF_ZONE_ID }}
        run: |
          ip=$(curl -fsS https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p')
          resp=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/firewall/access_rules/rules" \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            --data "{\"mode\":\"whitelist\",\"configuration\":{\"target\":\"ip\",\"value\":\"$ip\"},\"notes\":\"Temporary: $GITHUB_REPOSITORY es-ES run $GITHUB_RUN_ID\"}")
          [ "$(echo "$resp" | jq -r '.success')" = "true" ] || { echo "$resp"; exit 1; }
          echo "rule_id=$(echo "$resp" | jq -r '.result.id')" >> "$GITHUB_OUTPUT"

      - name: Wait for the Cloudflare allow rule to take effect
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$WIKI_URL/_api/sites" || echo 000)
            [ "$code" != "403" ] && exit 0
            sleep 5
          done
          exit 1

      - name: Publish
        env:
          WIKI_USERNAME: ${{ secrets.WIKI_USERNAME || vars.WIKI_USERNAME }}
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
          WIKI_TFA_SECRET: ${{ secrets.WIKI_TFA_SECRET || secrets.WIKI_2FA_SECRET }}
          WIKI_SITE_ID: ${{ secrets.WIKI_SITE_ID || vars.WIKI_SITE_ID }}
        run: |
          mkdir -p once/es
          cp docs/*.md once/es/
          python .github/scripts/wikijs_sync.py --src once --locales es --prefix latex/texshelf \
            --tags latex,typst,cli --no-pagetools

      - name: Remove the temporary Cloudflare rule
        if: always() && steps.cf_allow.outputs.rule_id != ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID || vars.CF_ZONE_ID }}
        run: |
          curl -sS -X DELETE "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/firewall/access_rules/rules/${{ steps.cf_allow.outputs.rule_id }}" \
            -H "Authorization: Bearer $CF_API_TOKEN" | jq '{success, errors}'
